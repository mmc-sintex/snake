<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>Snake Game | </title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 0%,#17294b 0%,#09101f 42%,#03060d 100%);
    color:white;
    font-family:Tahoma,Arial,sans-serif;
}

.game{
    width:min(94vw,520px);
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    color:#5cff99;
    text-shadow:0 0 25px rgba(92,255,153,.3);
}

.creator-top{
    color:#6e7b91;
    font-size:11px;
    margin-top:4px;
    margin-bottom:15px;
}

.stats{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

.stat{
    flex:1;
    padding:10px;
    border-radius:15px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
}

.stat small{
    display:block;
    color:#7f8ba0;
    font-size:10px;
    margin-bottom:4px;
}

.stat strong{
    font-size:23px;
}

#highScore{
    color:#ffd166;
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    padding:7px;
    border-radius:23px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(92,255,153,.22);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 45px rgba(92,255,153,.07);
}

canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:17px;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        #07101a;
    background-size:5% 5%;
}

.overlay{
    position:absolute;
    inset:7px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(2,7,16,.84);
    backdrop-filter:blur(8px);
    transition:.25s;
    z-index:5;
}

.overlay.hide{
    opacity:0;
    pointer-events:none;
}

.overlay h2{
    font-size:30px;
    color:#5cff99;
    margin-bottom:8px;
}

.overlay p{
    color:#a7b1c2;
    font-size:13px;
    margin-bottom:20px;
}

.main-btn{
    border:0;
    padding:13px 28px;
    border-radius:13px;
    background:#5cff99;
    color:#041008;
    font-weight:900;
    cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 25px rgba(92,255,153,.18);
}

.main-btn:active{
    transform:scale(.95);
}

.menu{
    width:90%;
    max-width:330px;
}

.menu-title{
    font-size:27px;
    color:#fff;
    margin-bottom:15px;
}

.color-title{
    color:#7d899d;
    font-size:12px;
    margin-bottom:10px;
}

.colors{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.color{
    width:35px;
    height:35px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
}

.color.active{
    border-color:white;
    transform:scale(1.12);
}

.green{background:#5cff99}
.blue{background:#55a8ff}
.purple{background:#c56cff}
.orange{background:#ff9f43}
.red{background:#ff5577}

.controls{
    width:min(230px,75vw);
    margin:15px auto 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    direction:ltr;
}

.control{
    height:50px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.07);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.control:active{
    transform:scale(.92);
    background:rgba(92,255,153,.15);
}

.up{
    grid-column:2;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}

.action-row{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.small-btn{
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.05);
    color:#cbd3e0;
    padding:9px 18px;
    border-radius:11px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
}

.small-btn:active{
    transform:scale(.94);
}

.creator{
    margin-top:15px;
    color:#59667b;
    font-size:10px;
}

.creator b{
    color:#8793a7;
}

.toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%) translateY(-100px);
    padding:10px 18px;
    border-radius:12px;
    background:#111b2b;
    border:1px solid rgba(255,255,255,.08);
    color:white;
    font-size:12px;
    transition:.3s;
    z-index:20;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

@media(max-width:400px){
    .logo{font-size:34px}
    .board{border-radius:18px}
    .overlay{inset:6px}
    .stat strong{font-size:20px}
}
</style>
</head>

<body>

<div class="game">

    <div class="logo">🐍 SNAKE</div>
    <div class="creator-top">نسخه ساخته شده برای وب</div>

    <div class="stats">
        <div class="stat">
            <small>امتیاز</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>رکورد</small>
            <strong id="highScore">0</strong>
        </div>
    </div>

    <div class="board">

        <canvas id="canvas" width="400" height="400"></canvas>

        <div class="overlay" id="overlay">

            <div class="menu">

                <h2 class="menu-title" id="overlayTitle">
                    🐍 Snake Game
                </h2>

                <p id="overlayText">
                    آماده‌ای رکورد جدید بزنی؟
                </p>

                <div class="color-title">
                    رنگ مار
                </div>

                <div class="colors">

                    <div class="color green active"
                         data-color="#5cff99"></div>

                    <div class="color blue"
                         data-color="#55a8ff"></div>

                    <div class="color purple"
                         data-color="#c56cff"></div>

                    <div class="color orange"
                         data-color="#ff9f43"></div>

                    <div class="color red"
                         data-color="#ff5577"></div>

                </div>

                <button class="main-btn" id="startBtn">
                    شروع بازی
                </button>

            </div>

        </div>

    </div>

    <div class="controls">

        <button class="control up" data-dir="up">▲</button>
        <button class="control left" data-dir="left">◀</button>
        <button class="control down" data-dir="down">▼</button>
        <button class="control right" data-dir="right">▶</button>

    </div>

    <div class="action-row">

        <button class="small-btn" id="pauseBtn">
            ⏸ توقف
        </button>

        <button class="small-btn" id="soundBtn">
            🔊 صدا
        </button>

    </div>

    <div class="creator">
        ساخته شده توسط <b></b>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");

const toast = document.getElementById("toast");

const GRID = 20;
const SIZE = 400;

let snake = [];
let food = {};

let direction = {x:1,y:0};
let nextDirection = {x:1,y:0};

let score = 0;
let highScore =
    Number(localStorage.getItem("snakeHighScoreMehdiBay")) || 0;

let snakeColor =
    localStorage.getItem("snakeColorMehdiBay") || "#5cff99";

let running = false;
let paused = false;

let gameTimer = null;
let speed = 125;

let soundEnabled =
    localStorage.getItem("snakeSoundMehdiBay") !== "off";

highScoreEl.textContent = highScore;


/* =========================
   Sound
========================= */

let audioContext = null;

function beep(frequency,duration=0.07,type="sine"){

    if(!soundEnabled) return;

    try{

        if(!audioContext){
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
            0.06,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    }catch(e){}
}


/* =========================
   Toast
========================= */

function showToast(text){

    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },1500);
}


/* =========================
   Start
========================= */

function startGame(){

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    direction = {x:1,y:0};
    nextDirection = {x:1,y:0};

    score = 0;
    speed = 125;

    scoreEl.textContent = "0";

    running = true;
    paused = false;

    pauseBtn.textContent = "⏸ توقف";

    overlay.classList.add("hide");

    createFood();

    clearInterval(gameTimer);

    gameTimer = setInterval(update,speed);

    beep(500,.08);

    draw();
}


/* =========================
   Food
========================= */

function createFood(){

    do{

        food = {
            x:Math.floor(Math.random()*GRID),
            y:Math.floor(Math.random()*GRID)
        };

    }while(
        snake.some(
            part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}


/* =========================
   Update
========================= */

function update(){

    if(!running || paused) return;

    direction = nextDirection;

    const head = {
        x:snake[0].x + direction.x,
        y:snake[0].y + direction.y
    };


    /* Wall collision */

    if(
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ){

        gameOver();
        return;
    }


    /* Body collision */

    for(let i=0;i<snake.length;i++){

        if(
            head.x === snake[i].x &&
            head.y === snake[i].y
        ){

            gameOver();
            return;
        }
    }

    snake.unshift(head);


    /* Food */

    if(
        head.x === food.x &&
        head.y === food.y
    ){

        score++;

        scoreEl.textContent = score;

        beep(650,.08,"square");

        createFood();

        /* Increase speed */

        if(score % 5 === 0 && speed > 65){

            speed -= 8;

            clearInterval(gameTimer);

            gameTimer =
                setInterval(update,speed);

            showToast("⚡ سرعت بیشتر شد!");
        }


        /* High Score */

        if(score > highScore){

            highScore = score;

            highScoreEl.textContent = highScore;

            localStorage.setItem(
                "snakeHighScoreMehdiBay",
                highScore
            );

            showToast("🏆 رکورد جدید!");
        }

    }else{

        snake.pop();
    }

    draw();
}


/* =========================
   Game Over
========================= */

function gameOver(){

    running = false;

    clearInterval(gameTimer);

    beep(120,.3,"sawtooth");

    overlayTitle.textContent = "💥 Game Over";

    overlayText.innerHTML =
        `امتیاز: <b>${score}</b> &nbsp; | &nbsp; رکورد: <b>${highScore}</b>`;

    startBtn.textContent = "دوباره بازی کن";

    overlay.classList.remove("hide");
}


/* =========================
   Pause
========================= */

function togglePause(){

    if(!running) return;

    paused = !paused;

    if(paused){

        pauseBtn.textContent = "▶ ادامه";
        showToast("⏸ بازی متوقف شد");

    }else{

        pauseBtn.textContent = "⏸ توقف";
        showToast("▶ بازی ادامه پیدا کرد");
    }
}


/* =========================
   Direction
========================= */

function changeDirection(dir){

    if(!running || paused) return;

    const directions = {

        up:{x:0,y:-1},
        down:{x:0,y:1},
        left:{x:-1,y:0},
        right:{x:1,y:0}

    };

    const newDir = directions[dir];

    if(!newDir) return;

    if(
        newDir.x === -direction.x &&
        newDir.y === -direction.y
    ){
        return;
    }

    nextDirection = newDir;
}


/* =========================
   Draw
========================= */

function draw(){

    ctx.clearRect(0,0,SIZE,SIZE);

    drawFood();

    snake.forEach((part,index)=>{

        const x = part.x * GRID;
        const y = part.y * GRID;

        const padding = 2;

        ctx.fillStyle =
            index === 0
            ? lightenColor(snakeColor)
            : snakeColor;

        roundRect(
            x+padding,
            y+padding,
            GRID-padding*2,
            GRID-padding*2,
            index === 0 ? 6 : 5
        );

        ctx.fill();


        /* Head eyes */

        if(index === 0){

            ctx.fillStyle="#07101a";

            let e1,e2;

            if(direction.x === 1){

                e1=[x+14,y+6];
                e2=[x+14,y+13];

            }else if(direction.x === -1){

                e1=[x+6,y+6];
                e2=[x+6,y+13];

            }else if(direction.y === -1){

                e1=[x+6,y+6];
                e2=[x+13,y+6];

            }else{

                e1=[x+6,y+14];
                e2=[x+13,y+14];
            }

            ctx.beginPath();
            ctx.arc(e1[0],e1[1],2,0,Math.PI*2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(e2[0],e2[1],2,0,Math.PI*2);
            ctx.fill();
        }

    });
}


/* =========================
   Food
========================= */

function drawFood(){

    const x = food.x*GRID + GRID/2;
    const y = food.y*GRID + GRID/2;

    ctx.save();

    ctx.shadowColor="#ff5577";
    ctx.shadowBlur=18;

    ctx.fillStyle="#ff5577";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    /* Leaf */

    ctx.fillStyle="#5cff99";

    ctx.beginPath();

    ctx.ellipse(
        x+5,
        y-6,
        4,
        2,
        -.6,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   Rounded Rectangle
========================= */

function roundRect(
    x,y,w,h,r
){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,y,
        x+w,y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,y+h,
        x+w-r,y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,y+h,
        x,y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,y,
        x+r,y
    );

    ctx.closePath();
}


/* =========================
   Color helper
========================= */

function lightenColor(hex){

    const num =
        parseInt(hex.replace("#",""),16);

    const r =
        Math.min(255,((num>>16)&255)+45);

    const g =
        Math.min(255,((num>>8)&255)+45);

    const b =
        Math.min(255,(num&255)+45);

    return `rgb(${r},${g},${b})`;
}


/* =========================
   Keyboard
========================= */

document.addEventListener("keydown",e=>{

    const key = e.key;

    const map = {

        ArrowUp:"up",
        ArrowDown:"down",
        ArrowLeft:"left",
        ArrowRight:"right",

        w:"up",
        W:"up",

        s:"down",
        S:"down",

        a:"left",
        A:"left",

        d:"right",
        D:"right"
    };

    if(map[key]){

        e.preventDefault();

        if(!running){
            startGame();
        }

        changeDirection(map[key]);
    }


    if(key === " "){

        e.preventDefault();

        if(running){
            togglePause();
        }else{
            startGame();
        }
    }

});


/* =========================
   Mobile buttons
========================= */

document
.querySelectorAll(".control")
.forEach(button=>{

    button.addEventListener("click",()=>{

        if(!running){
            startGame();
        }

        changeDirection(
            button.dataset.dir
        );
    });

});


/* =========================
   Start button
========================= */

startBtn.addEventListener(
    "click",
    startGame
);


/* =========================
   Pause button
========================= */

pauseBtn.addEventListener(
    "click",
    togglePause
);


/* =========================
   Sound
========================= */

soundBtn.addEventListener("click",()=>{

    soundEnabled = !soundEnabled;

    localStorage.setItem(
        "snakeSoundMehdiBay",
        soundEnabled ? "on" : "off"
    );

    soundBtn.textContent =
        soundEnabled
        ? "🔊 صدا"
        : "🔇 صدا خاموش";

    showToast(
        soundEnabled
        ? "🔊 صدا روشن شد"
        : "🔇 صدا خاموش شد"
    );
});


/* =========================
   Color Selection
========================= */

document
.querySelectorAll(".color")
.forEach(color=>{

    color.addEventListener("click",()=>{

        snakeColor =
            color.dataset.color;

        localStorage.setItem(
            "snakeColorMehdiBay",
            snakeColor
        );

        document
        .querySelectorAll(".color")
        .forEach(c=>c.classList.remove("active"));

        color.classList.add("active");

        draw();

        beep(700,.06);
    });

});


/* Restore selected color */

document
.querySelectorAll(".color")
.forEach(color=>{

    if(
        color.dataset.color === snakeColor
    ){
        color.classList.add("active");
    }else{
        color.classList.remove("active");
    }

});


/* Initial snake */

snake=[
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
];

direction={x:1,y:0};
nextDirection={x:1,y:0};

food={
    x:15,
    y:10
};

draw();

</script>

</body>
</html>
