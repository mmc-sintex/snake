Enter<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Snake Game 🐍</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #173d25,
          #07120b 60%,
          #030705
        );

      color: white;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      margin: 0;

      color: #61ff78;

      font-size: 40px;

      text-shadow:
        0 0 20px rgba(97,255,120,.25);
    }

    .subtitle {
      margin: 7px 0 18px;

      color: #8ca693;

      font-size: 14px;
    }

    .game-box {
      background: rgba(7, 20, 12, .95);

      border:
        1px solid #285234;

      border-radius: 20px;

      padding: 15px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);
    }

    /* =========================
       SCORE
    ========================= */

    .top-bar {
      display: flex;

      justify-content: space-between;

      margin-bottom: 12px;

      font-size: 17px;
    }

    .score {
      color: #61ff78;
      font-weight: bold;
    }

    /* =========================
       CANVAS
    ========================= */

    canvas {
      display: block;

      width: 100%;
      max-width: 500px;

      aspect-ratio: 1 / 1;

      margin: auto;

      background: #061009;

      border:
        2px solid #2b5937;

      border-radius: 12px;

      image-rendering: pixelated;

      touch-action: none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      min-height: 24px;

      margin: 12px 0;

      color: #a5b8aa;

      font-size: 14px;
    }

    /* =========================
       NAME
    ========================= */

    .name-input {
      width: 100%;
      max-width: 350px;

      padding: 13px;

      margin-bottom: 10px;

      background: #071009;

      color: white;

      border:
        1px solid #315c3c;

      border-radius: 10px;

      outline: none;

      text-align: center;

      font-size: 15px;
    }

    .name-input:focus {
      border-color: #61ff78;
    }

    /* =========================
       START BUTTON
    ========================= */

    .start-button {
      width: 100%;
      max-width: 350px;

      padding: 13px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #42e65a,
          #159c35
        );

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .start-button:active {
      transform: scale(.97);
    }

    /* =========================
       MOBILE CONTROLS
       
       چیدمان:
       
             ⬆️
        ➡️   ⬇️   ⬅️
    ========================= */

    .controls {
      width: 210px;

      margin: 20px auto 5px;

      display: grid;

      grid-template-columns:
        60px 60px 60px;

      grid-template-rows:
        60px 60px;

      gap: 8px;

      justify-content: center;

      /* جلوگیری از تأثیر RTL */
      direction: ltr;
    }

    .control-button {
      width: 60px;
      height: 60px;

      border:
        1px solid #315b3a;

      border-radius: 14px;

      background: #132a19;

      color: white;

      font-size: 25px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      user-select: none;

      touch-action: manipulation;
    }

    .control-button:active {
      background: #2e6c3c;

      transform: scale(.90);
    }

    /* بالا */

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    /* راست - سمت چپ صفحه */

    .right {
      grid-column: 1;
      grid-row: 2;
    }

    /* پایین */

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    /* چپ - سمت راست صفحه */

    .left {
      grid-column: 3;
      grid-row: 2;
    }

    /* =========================
       HELP
    ========================= */

    .help {
      margin-top: 15px;

      color: #687c6d;

      font-size: 12px;

      line-height: 2;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 450px) {

      h1 {
        font-size: 30px;
      }

      .game-box {
        padding: 10px;
      }

      .controls {
        margin-top: 12px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>🐍 Snake</h1>

    <div class="subtitle">
      رکوردت رو بزن!
    </div>


    <div class="game-box">

      <!-- امتیاز -->

      <div class="top-bar">

        <div>
          امتیاز:
          <span
            id="score"
            class="score">
            0
          </span>
        </div>

        <div>
          رکورد:
          <span
            id="best"
            class="score">
            0
          </span>
        </div>

      </div>


      <!-- نام -->

      <input
        id="playerName"
        class="name-input"
        maxlength="20"
        placeholder="نام بازیکن">


      <!-- بازی -->

      <canvas
        id="game"
        width="400"
        height="400">
      </canvas>


      <!-- پیام -->

      <div
        id="message"
        class="message">

        برای شروع بازی روی دکمه بزن

      </div>


      <!-- شروع -->

      <button
        id="startButton"
        class="start-button">

        شروع بازی 🎮

      </button>


      <!-- =========================
           دکمه‌های بازی
           
                 ⬆️
            ➡️   ⬇️   ⬅️
      ========================= -->

      <div class="controls">

        <button
          class="control-button up"
          data-direction="up">

          ⬆️

        </button>


        <button
          class="control-button right"
          data-direction="right">

          ➡️

        </button>


        <button
          class="control-button down"
          data-direction="down">

          ⬇️

        </button>


        <button
          class="control-button left"
          data-direction="left">

          ⬅️

        </button>

      </div>


      <div class="help">

        کامپیوتر:
        Arrow Keys یا WASD

        <br>

        موبایل:
        دکمه‌های جهت‌دار

      </div>

    </div>

  </div>


<script>

  /* =====================================
     تنظیمات
  ===================================== */

  const canvas =
    document.getElementById("game");

  const ctx =
    canvas.getContext("2d");


  const scoreElement =
    document.getElementById("score");

  const bestElement =
    document.getElementById("best");

  const messageElement =
    document.getElementById("message");

  const startButton =
    document.getElementById("startButton");

  const nameInput =
    document.getElementById("playerName");


  const GRID = 20;

  const CELL =
    canvas.width / GRID;


  /* =====================================
     متغیرهای بازی
  ===================================== */

  let snake = [];

  let food = {
    x: 5,
    y: 5
  };


  let direction = {
    x: 1,
    y: 0
  };


  let nextDirection = {
    x: 1,
    y: 0
  };


  let score = 0;

  let gameRunning = false;

  let timer = null;


  let best =
    Number(
      localStorage.getItem(
        "snake_best"
      )
    ) || 0;


  bestElement.textContent = best;


  /* =====================================
     شروع بازی
  ===================================== */

  function startGame() {

    snake = [

      {
        x: 10,
        y: 10
      },

      {
        x: 9,
        y: 10
      },

      {
        x: 8,
        y: 10
      }

    ];


    direction = {
      x: 1,
      y: 0
    };


    nextDirection = {
      x: 1,
      y: 0
    };


    score = 0;

    scoreElement.textContent =
      score;


    createFood();


    gameRunning = true;


    messageElement.textContent =
      "بازی شروع شد! 🚀";


    startButton.textContent =
      "شروع دوباره 🔄";


    clearInterval(timer);


    timer =
      setInterval(
        updateGame,
        110
      );


    drawGame();

  }


  /* =====================================
     ساخت غذا
  ===================================== */

  function createFood() {

    do {

      food = {

        x:
          Math.floor(
            Math.random() * GRID
          ),

        y:
          Math.floor(
            Math.random() * GRID
          )

      };

    }

    while (
      snake.some(
        part =>
          part.x === food.x &&
          part.y === food.y
      )
    );

  }


  /* =====================================
     حرکت
  ===================================== */

  function updateGame() {

    if (!gameRunning) {
      return;
    }


    direction =
      nextDirection;


    const head = {

      x:
        snake[0].x +
        direction.x,

      y:
        snake[0].y +
        direction.y

    };


    /* برخورد با دیوار */

    if (

      head.x < 0 ||

      head.x >= GRID ||

      head.y < 0 ||

      head.y >= GRID

    ) {

      gameOver();

      return;

    }


    /* برخورد با خودش */

    const hitSelf =
      snake.some(

        part =>

          part.x === head.x &&

          part.y === head.y

      );


    if (hitSelf) {

      gameOver();

      return;

    }


    /* اضافه کردن سر */

    snake.unshift(head);


    /* غذا */

    if (

      head.x === food.x &&

      head.y === food.y

    ) {

      score += 10;

      scoreElement.textContent =
        score;

      createFood();

    }

    else {

      snake.pop();

    }


    drawGame();

  }


  /* =====================================
     پایان
  ===================================== */

  function gameOver() {

    gameRunning = false;

    clearInterval(timer);


    if (score > best) {

      best = score;


      localStorage.setItem(
        "snake_best",
        best
      );


      bestElement.textContent =
        best;

    }


    messageElement.textContent =
      `باختی! امتیازت ${score} شد 😵`;

  }


  /* =====================================
     تغییر جهت
  ===================================== */

  function changeDirection(dir) {

    if (!gameRunning) {
      return;
    }


    const directions = {

      up: {
        x: 0,
        y: -1
      },

      down: {
        x: 0,
        y: 1
      },

      left: {
        x: -1,
        y: 0
      },

      right: {
        x: 1,
        y: 0
      }

    };


    const newDirection =
      directions[dir];


    /* جلوگیری از برگشت */

    if (

      newDirection.x ===
      -direction.x &&

      newDirection.y ===
      -direction.y

    ) {

      return;

    }


    nextDirection =
      newDirection;

  }


  /* =====================================
     کیبورد
  ===================================== */

  document.addEventListener(
    "keydown",
    function(event) {

      if (

        event.key === "ArrowUp" ||

        event.key === "w" ||

        event.key === "W"

      ) {

        event.preventDefault();

        changeDirection("up");

      }


      if (

        event.key === "ArrowDown" ||

        event.key === "s" ||

        event.key === "S"

      ) {

        event.preventDefault();

        changeDirection("down");

      }


      if (

        event.key === "ArrowLeft" ||

        event.key === "a" ||

        event.key === "A"

      ) {

        event.preventDefault();

        changeDirection("left");

      }


      if (

        event.key === "ArrowRight" ||

        event.key === "d" ||

        event.key === "D"

      ) {

        event.preventDefault();

        changeDirection("right");

      }

    }
  );


  /* =====================================
     دکمه موبایل
  ===================================== */

  document
    .querySelectorAll(
      ".control-button"
    )
    .forEach(button => {

      button.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();


          const dir =
            button.dataset.direction;


          changeDirection(dir);

        }
      );

    });


  /* =====================================
     شروع
  ===================================== */

  startButton.addEventListener(
    "click",
    startGame
  );


  /* =====================================
     رسم
  ===================================== */

  function drawGame() {

    /* پس‌زمینه */

    ctx.fillStyle =
      "#061009";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* گرید */

    ctx.strokeStyle =
      "rgba(80,150,90,.08)";

    ctx.lineWidth = 1;


    for (
      let i = 0;
      i <= GRID;
      i++
    ) {

      ctx.beginPath();

      ctx.moveTo(
        i * CELL,
        0
      );

      ctx.lineTo(
        i * CELL,
        canvas.height
      );

      ctx.stroke();


      ctx.beginPath();

      ctx.moveTo(
        0,
        i * CELL
      );

      ctx.lineTo(
        canvas.width,
        i * CELL
      );

      ctx.stroke();

    }


    /* غذا */

    const foodX =
      food.x * CELL +
      CELL / 2;

    const foodY =
      food.y * CELL +
      CELL / 2;


    ctx.fillStyle =
      "#ff4d5f";

    ctx.shadowColor =
      "#ff4d5f";

    ctx.shadowBlur = 15;


    ctx.beginPath();

    ctx.arc(
      foodX,
      foodY,
      CELL * .32,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* مار */

    snake.forEach(
      (part, index) => {

        const padding = 2;


        const x =
          part.x * CELL +
          padding;

        const y =
          part.y * CELL +
          padding;


        const size =
          CELL -
          padding * 2;


        ctx.fillStyle =
          index === 0
            ? "#8aff96"
            : "#38d957";


        ctx.beginPath();

        ctx.roundRect(
          x,
          y,
          size,
          size,
          5
        );

        ctx.fill();

      }
    );


    /* چشم */

    if (snake.length) {

      const head =
        snake[0];


      ctx.fillStyle =
        "#061009";


      let eye1;
      let eye2;


      if (direction.x === 1) {

        eye1 = [
          head.x * CELL + 14,
          head.y * CELL + 6
        ];

        eye2 = [
          head.x * CELL + 14,
          head.y * CELL + 14
        ];

      }

      else if (direction.x === -1) {

        eye1 = [
          head.x * CELL + 6,
          head.y * CELL + 6
        ];

        eye2 = [
          head.x * CELL + 6,
          head.y * CELL + 14
        ];

      }

      else if (direction.y === -1) {

        eye1 = [
          head.x * CELL + 6,
          head.y * CELL + 6
        ];

        eye2 = [
          head.x * CELL + 14,
          head.y * CELL + 6
        ];

      }

      else {

        eye1 = [
          head.x * CELL + 6,
          head.y * CELL + 14
        ];

        eye2 = [
          head.x * CELL + 14,
          head.y * CELL + 14
        ];

      }


      ctx.beginPath();

      ctx.arc(
        eye1[0],
        eye1[1],
        2,
        0,
        Math.PI * 2
      );

      ctx.fill();


      ctx.beginPath();

      ctx.arc(
        eye2[0],
        eye2[1],
        2,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

  }


  /* =====================================
     اجرای اولیه
  ===================================== */

  drawGame();

</script>

</body>
</html>
