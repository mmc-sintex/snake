<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Snake Pro | مهدی بای</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at top,#164e63,#020617 70%);

  color: white;
  font-family: Arial,sans-serif;
  text-align: center;
}

.container {
  width: 94%;
  max-width: 500px;
  margin: auto;
  padding: 15px 0 80px;
}

h1 {
  color: #4ade80;
  font-size: 40px;

  text-shadow:
    0 0 20px #22c55e;
}

.menu {
  background: #0f172a;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 12px;
}

button {
  border: none;
  padding: 12px 18px;
  margin: 5px;

  border-radius: 10px;

  color: white;
  background: #22c55e;

  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.95);
}

input {
  width: 90%;
  padding: 12px;

  margin: 5px;

  border-radius: 10px;
  border: 1px solid #475569;

  background: #020617;
  color: white;

  font-size: 16px;
}

.info {
  display: flex;
  justify-content: space-around;

  background: #0f172a;

  padding: 12px;

  border-radius: 12px;

  margin-bottom: 10px;
}

.info span {
  color: #4ade80;
  font-weight: bold;
}

canvas {

  width: min(92vw,440px);
  height: min(92vw,440px);

  background: #07111f;

  border: 3px solid #22c55e;

  border-radius: 15px;

  box-shadow:
    0 0 25px rgba(34,197,94,.25);
}

.controls {

  width: 190px;

  margin: 15px auto;

  display: grid;

  grid-template-columns:
    repeat(3,60px);

  gap: 5px;

  direction: ltr;
}

.controls button {

  width: 60px;
  height: 55px;

  padding: 0;

  font-size: 22px;

  background: #1e293b;
}

.up {
  grid-column: 2;
}

.left {
  grid-column: 1;
  grid-row: 2;
}

.down {
  grid-column: 2;
  grid-row: 2;
}

.right {
  grid-column: 3;
  grid-row: 2;
}

.box {

  background: #0f172a;

  padding: 15px;

  border-radius: 15px;

  margin-top: 15px;
}

.player {

  display: flex;

  justify-content:
    space-between;

  background: #1e293b;

  padding: 11px;

  margin: 5px 0;

  border-radius: 9px;
}

.player strong {
  color: #4ade80;
}

.creator {

  position: fixed;

  bottom: 10px;
  right: 10px;

  background: #0f172a;

  color: #4ade80;

  padding: 8px 12px;

  border-radius: 10px;

  border:
    1px solid #22c55e;

  font-size: 13px;
}

.hidden {
  display: none;
}

#message {
  min-height: 25px;
  color: #facc15;
}

</style>

</head>

<body>

<div class="container">

<h1>🐍 Snake Pro</h1>

<div id="message"></div>


<!-- نام بازیکن -->

<div class="box">

<h3>👤 نام بازیکن</h3>

<input
id="playerName"
placeholder="مثلاً مهدی">

<button onclick="loginGuest()">
ورود به بازی
</button>

</div>


<!-- منو -->

<div class="menu">

<button onclick="startGame()">
🎮 شروع بازی
</button>

<button onclick="showLeaderboard()">
🏆 لیدربرد آنلاین
</button>

</div>


<!-- اطلاعات -->

<div class="info">

<div>
امتیاز:
<span id="score">0</span>
</div>

<div>
رکورد:
<span id="highScore">0</span>
</div>

</div>


<!-- بازی -->

<canvas
id="game"
width="440"
height="440">
</canvas>


<!-- کنترل موبایل -->

<div class="controls">

<button
class="up"
onclick="changeDirection(0,-1)">
⬆️
</button>

<button
class="left"
onclick="changeDirection(-1,0)">
⬅️
</button>

<button
class="down"
onclick="changeDirection(0,1)">
⬇️
</button>

<button
class="right"
onclick="changeDirection(1,0)">
➡️
</button>

</div>


<!-- لیدربرد -->

<div
id="leaderboard"
class="box hidden">

<h2>
🏆 لیدربرد آنلاین
</h2>

<div id="players">
در حال دریافت رکوردها...
</div>

<button onclick="hideLeaderboard()">
بستن
</button>

</div>


<div class="creator">
ساخته شده توسط مهدی بای ❤️
</div>

</div>


<script>

/* =====================================
   این دو خط را تغییر بده
===================================== */

const SUPABASE_URL =
"اینجا URL پروژه را بگذار";

const SUPABASE_KEY =
"اینجا Publishable Key را بگذار";


/* =====================================
   اتصال به Supabase
===================================== */

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;

let playerName = "";

let snake = [];

let food = {};

let direction = {
  x: 1,
  y: 0
};

let nextDirection = {
  x: 1,
  y: 0
};

let score = 0;

let highScore =
Number(
  localStorage.getItem("snakeHighScore")
) || 0;

let running = false;

let timer;

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const grid = 22;

const tile = 20;


/* =====================================
   پیام
===================================== */

function message(text) {

  document.getElementById(
    "message"
  ).textContent = text;

}


/* =====================================
   ورود مهمان
===================================== */

async function loginGuest() {

  playerName =
    document.getElementById(
      "playerName"
    ).value.trim();

  if (!playerName) {

    message(
      "اول اسمت را بنویس!"
    );

    return;

  }

  const {
    data,
    error
  } =
  await db.auth.signInAnonymously();


  if (error) {

    message(
      "خطا در ورود: " +
      error.message
    );

    return;

  }


  currentUser =
    data.user;


  message(
    "سلام " +
    playerName +
    " 👋"
  );

}


/* =====================================
   شروع بازی
===================================== */

function startGame() {

  if (!currentUser) {

    message(
      "اول نامت را بنویس و ورود به بازی را بزن!"
    );

    return;

  }


  snake = [

    {x:10,y:11},

    {x:9,y:11},

    {x:8,y:11}

  ];


  direction = {
    x:1,
    y:0
  };

  nextDirection = {
    x:1,
    y:0
  };


  score = 0;

  running = true;


  createFood();


  clearInterval(timer);


  timer =
    setInterval(
      gameLoop,
      120
    );


  updateScore();

  draw();

}


/* =====================================
   حلقه بازی
===================================== */

function gameLoop() {

  if (!running)
    return;


  direction =
    nextDirection;


  const head = {

    x:
      snake[0].x +
      direction.x,

    y:
      snake[0].y +
      direction.y

  };


  /* دیوار */

  if (

    head.x < 0 ||

    head.x >= grid ||

    head.y < 0 ||

    head.y >= grid

  ) {

    endGame();

    return;

  }


  /* بدن */

  if (

    snake.some(
      part =>

      part.x === head.x &&

      part.y === head.y

    )

  ) {

    endGame();

    return;

  }


  snake.unshift(head);


  /* غذا */

  if (

    head.x === food.x &&

    head.y === food.y

  ) {

    score++;

    createFood();

  }

  else {

    snake.pop();

  }


  updateScore();

  draw();

}


/* =====================================
   غذا
===================================== */

function createFood() {

  food = {

    x:
      Math.floor(
        Math.random() * grid
      ),

    y:
      Math.floor(
        Math.random() * grid
      )

  };

}


/* =====================================
   پایان بازی
===================================== */

async function endGame() {

  running = false;

  clearInterval(timer);


  if (
    score > highScore
  ) {

    highScore =
      score;

    localStorage.setItem(
      "snakeHighScore",
      highScore
    );

  }


  updateScore();


  if (score > 0) {

    await saveScore();

  }


  message(
    "بازی تمام شد! امتیاز: " +
    score
  );

}


/* =====================================
   ذخیره آنلاین امتیاز
===================================== */

async function saveScore() {

  if (!currentUser)
    return;


  const {
    error
  } =

  await db
    .from("leaderboard")
    .insert({

      user_id:
        currentUser.id,

      player_name:
        playerName,

      score:
        score

    });


  if (error) {

    console.log(error);

    message(
      "امتیاز ذخیره نشد!"
    );

    return;

  }


  message(
    "🏆 امتیازت در لیدربرد ثبت شد!"
  );

}


/* =====================================
   لیدربرد آنلاین
===================================== */

async function showLeaderboard() {

  document
    .getElementById(
      "leaderboard"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "players"
    )
    .innerHTML =
      "⏳ در حال دریافت...";


  const {
    data,
    error
  } =

  await db
    .from("leaderboard")

    .select(
      "player_name,score,created_at"
    )

    .order(
      "score",
      {
        ascending:false
      }
    )

    .limit(20);


  if (error) {

    document
      .getElementById(
        "players"
      )
      .textContent =
        "خطا در دریافت لیدربرد.";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    document
      .getElementById(
        "players"
      )
      .textContent =
        "هنوز کسی رکورد ثبت نکرده.";

    return;

  }


  let html = "";


  data.forEach(
    (player,index) => {

      html += `

        <div class="player">

          <span>
            #${index + 1}
            ${escapeHTML(
              player.player_name
            )}
          </span>

          <strong>
            ${player.score}
          </strong>

        </div>

      `;

    }
  );


  document
    .getElementById(
      "players"
    )
    .innerHTML =
      html;

}


/* =====================================
   بستن لیدربرد
===================================== */

function hideLeaderboard() {

  document
    .getElementById(
      "leaderboard"
    )
    .classList
    .add("hidden");

}


/* =====================================
   تغییر جهت
===================================== */

function changeDirection(x,y) {

  if (!running)
    return;


  if (

    x === -direction.x &&

    y === -direction.y

  )
    return;


  nextDirection = {
    x:x,
    y:y
  };

}


/* =====================================
   کیبورد
===================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowUp"
    )
      changeDirection(0,-1);


    if (
      event.key === "ArrowDown"
    )
      changeDirection(0,1);


    if (
      event.key === "ArrowLeft"
    )
      changeDirection(-1,0);


    if (
      event.key === "ArrowRight"
    )
      changeDirection(1,0);

  }
);


/* =====================================
   امتیاز
===================================== */

function updateScore() {

  document
    .getElementById(
      "score"
    )
    .textContent =
      score;


  document
    .getElementById(
      "highScore"
    )
    .textContent =
      highScore;

}


/* =====================================
   رسم
===================================== */

function draw() {

  ctx.fillStyle =
    "#07111f";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* غذا */

  ctx.fillStyle =
    "#ef4444";


  ctx.beginPath();


  ctx.arc(

    food.x * tile + 10,

    food.y * tile + 10,

    7,

    0,

    Math.PI * 2

  );


  ctx.fill();


  /* مار */

  snake.forEach(
    (part,index) => {

      ctx.fillStyle =
        index === 0
        ? "#bbf7d0"
        : "#22c55e";


      ctx.fillRect(

        part.x * tile + 2,

        part.y * tile + 2,

        16,

        16

      );

    }
  );

}


/* =====================================
   امنیت اسم بازیکن
===================================== */

function escapeHTML(text) {

  return text

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================
   صفحه اول
===================================== */

snake = [

  {x:10,y:11},

  {x:9,y:11},

  {x:8,y:11}

];


food = {
  x:15,
  y:11
};


draw();

updateScore();

</script>

</body>

  </html>
