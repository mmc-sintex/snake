<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake Pro</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #164e63, #020617 65%);
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 95%;
  max-width: 520px;
  text-align: center;
}

h1 {
  margin: 0 0 10px;
  font-size: 42px;
  color: #4ade80;
  text-shadow: 0 0 20px #22c55e;
}

.info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 12px 18px;
  background: rgba(15, 23, 42, .8);
  border: 1px solid #334155;
  border-radius: 14px;
  font-size: 18px;
}

.info span {
  color: #4ade80;
  font-weight: bold;
}

.game-box {
  position: relative;
  display: inline-block;
}

canvas {
  display: block;
  width: min(90vw, 440px);
  height: min(90vw, 440px);
  background: #07111f;
  border: 3px solid #22c55e;
  border-radius: 16px;
  box-shadow:
    0 0 25px rgba(34,197,94,.25),
    inset 0 0 30px rgba(0,0,0,.5);
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(2, 6, 23, .88);
  border-radius: 14px;
  padding: 20px;
}

.overlay.hidden {
  display: none;
}

.overlay h2 {
  font-size: 35px;
  color: #4ade80;
  margin: 10px;
}

.overlay p {
  color: #cbd5e1;
  font-size: 17px;
}

button {
  border: none;
  cursor: pointer;
  color: white;
  font-weight: bold;
  border-radius: 12px;
  transition: .15s;
}

.main-btn {
  padding: 13px 30px;
  font-size: 18px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  box-shadow: 0 5px 15px rgba(34,197,94,.3);
}

.main-btn:hover {
  transform: scale(1.05);
}

.controls {
  margin: 18px auto 0;
  width: 180px;
  display: grid;
  grid-template-columns: repeat(3, 55px);
  gap: 7px;
  direction: ltr;
}

.controls button {
  width: 55px;
  height: 55px;
  background: #1e293b;
  border: 1px solid #475569;
  font-size: 23px;
}

.controls button:active {
  background: #22c55e;
  transform: scale(.92);
}

.up {
  grid-column: 2;
}

.left {
  grid-column: 1;
  grid-row: 2;
}

.down {
  grid-column: 2;
  grid-row: 2;
}

.right {
  grid-column: 3;
  grid-row: 2;
}

.bottom-buttons {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.small-btn {
  padding: 9px 18px;
  background: #334155;
}

.help {
  margin-top: 14px;
  color: #94a3b8;
  font-size: 13px;
}

@media (max-width: 400px) {
  h1 {
    font-size: 34px;
  }

  .info {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🐍 Snake Pro</h1>

  <div class="info">
    <div>امتیاز: <span id="score">0</span></div>
    <div>رکورد: <span id="highScore">0</span></div>
    <div>سرعت: <span id="speed">1</span></div>
  </div>

  <div class="game-box">

    <canvas id="game" width="440" height="440"></canvas>

    <div id="overlay" class="overlay">

      <h2 id="overlayTitle">🐍 Snake Pro</h2>

      <p id="overlayText">
        آماده‌ای رکوردت رو بشکنی؟
      </p>

      <button class="main-btn" onclick="startGame()">
        شروع بازی 🎮
      </button>

    </div>

  </div>

  <div class="controls">

    <button class="up" onclick="changeDirection(0,-1)">⬆️</button>

    <button class="left" onclick="changeDirection(-1,0)">⬅️</button>

    <button class="down" onclick="changeDirection(0,1)">⬇️</button>

    <button class="right" onclick="changeDirection(1,0)">➡️</button>

  </div>

  <div class="bottom-buttons">

    <button class="small-btn" onclick="togglePause()">
      ⏸️ توقف
    </button>

    <button class="small-btn" onclick="restartGame()">
      🔄 دوباره
    </button>

  </div>

  <div class="help">
    کامپیوتر: کلیدهای جهت‌دار ⬆️⬇️⬅️➡️
    <br>
    موبایل: از دکمه‌های پایین استفاده کن
  </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const speedElement = document.getElementById("speed");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const grid = 22;
const tile = canvas.width / grid;

let snake;
let food;

let direction;
let nextDirection;

let score = 0;
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

let gameRunning = false;
let paused = false;

let gameTimer;

let speed = 1;
let interval = 140;

highScoreElement.textContent = highScore;


/* =========================
   صدا
========================= */

let audioContext;

function beep(frequency = 500, duration = 80) {

  try {

    if (!audioContext) {
      audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value = frequency;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    gain.gain.value = 0.08;

    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
    }, duration);

  } catch(e) {}

}


/* =========================
   شروع بازی
========================= */

function startGame() {

  snake = [
    {x: 10, y: 11},
    {x: 9, y: 11},
    {x: 8, y: 11}
  ];

  direction = {
    x: 1,
    y: 0
  };

  nextDirection = {
    x: 1,
    y: 0
  };

  score = 0;
  speed = 1;
  interval = 140;

  gameRunning = true;
  paused = false;

  updateInfo();

  createFood();

  overlay.classList.add("hidden");

  clearInterval(gameTimer);

  gameTimer = setInterval(gameLoop, interval);

  draw();

  beep(600, 100);
}


/* =========================
   بازی دوباره
========================= */

function restartGame() {

  startGame();

}


/* =========================
   حلقه بازی
========================= */

function gameLoop() {

  if (!gameRunning || paused) {
    return;
  }

  direction = nextDirection;

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };


  /* برخورد با دیوار */

  if (
    head.x < 0 ||
    head.x >= grid ||
    head.y < 0 ||
    head.y >= grid
  ) {

    gameOver();

    return;
  }


  /* برخورد با بدن */

  if (
    snake.some(part =>
      part.x === head.x &&
      part.y === head.y
    )
  ) {

    gameOver();

    return;
  }


  snake.unshift(head);


  /* خوردن غذا */

  if (
    head.x === food.x &&
    head.y === food.y
  ) {

    score++;

    beep(850, 90);

    createFood();

    increaseSpeed();

  } else {

    snake.pop();

  }

  updateInfo();

  draw();

}


/* =========================
   افزایش سرعت
========================= */

function increaseSpeed() {

  if (score % 5 === 0) {

    speed++;

    interval = Math.max(55, interval - 15);

    clearInterval(gameTimer);

    gameTimer =
      setInterval(gameLoop, interval);

  }

}


/* =========================
   غذا
========================= */

function createFood() {

  do {

    food = {
      x: Math.floor(Math.random() * grid),
      y: Math.floor(Math.random() * grid)
    };

  } while (
    snake.some(part =>
      part.x === food.x &&
      part.y === food.y
    )
  );

}


/* =========================
   تغییر جهت
========================= */

function changeDirection(x, y) {

  if (!gameRunning || paused) {
    return;
  }

  // جلوگیری از برگشت مستقیم

  if (
    x === -direction.x &&
    y === -direction.y
  ) {
    return;
  }

  nextDirection = {
    x: x,
    y: y
  };

}


/* =========================
   کیبورد
========================= */

document.addEventListener("keydown", function(event) {

  if (event.key === "ArrowUp") {
    changeDirection(0, -1);
  }

  if (event.key === "ArrowDown") {
    changeDirection(0, 1);
  }

  if (event.key === "ArrowLeft") {
    changeDirection(-1, 0);
  }

  if (event.key === "ArrowRight") {
    changeDirection(1, 0);
  }

  if (event.code === "Space") {
    togglePause();
  }

});


/* =========================
   توقف بازی
========================= */

function togglePause() {

  if (!gameRunning) {
    return;
  }

  paused = !paused;

  if (paused) {

    overlayTitle.textContent = "⏸️ بازی متوقف شد";

    overlayText.textContent =
      "برای ادامه روی دکمه زیر بزن";

    overlay.classList.remove("hidden");

    document.querySelector(".main-btn").textContent =
      "ادامه بازی ▶️";

    document.querySelector(".main-btn").onclick =
      togglePause;

  } else {

    overlay.classList.add("hidden");

    document.querySelector(".main-btn").textContent =
      "شروع بازی 🎮";

    document.querySelector(".main-btn").onclick =
      startGame;

  }

}


/* =========================
   پایان بازی
========================= */

function gameOver() {

  gameRunning = false;

  clearInterval(gameTimer);

  beep(180, 250);

  if (score > highScore) {

    highScore = score;

    localStorage.setItem(
      "snakeHighScore",
      highScore
    );

  }

  updateInfo();

  overlayTitle.textContent =
    "💀 Game Over";

  overlayText.textContent =
    `امتیازت: ${score} | رکورد: ${highScore}`;

  document.querySelector(".main-btn").textContent =
    "بازی دوباره 🔄";

  document.querySelector(".main-btn").onclick =
    startGame;

  overlay.classList.remove("hidden");

}


/* =========================
   اطلاعات
========================= */

function updateInfo() {

  scoreElement.textContent = score;

  highScoreElement.textContent = highScore;

  speedElement.textContent = speed;

}


/* =========================
   رسم بازی
========================= */

function draw() {

  /* پس‌زمینه */

  ctx.fillStyle = "#07111f";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* خطوط زمین */

  ctx.strokeStyle =
    "rgba(255,255,255,.035)";

  ctx.lineWidth = 1;

  for (let i = 0; i <= grid; i++) {

    ctx.beginPath();

    ctx.moveTo(i * tile, 0);

    ctx.lineTo(i * tile, canvas.height);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(0, i * tile);

    ctx.lineTo(canvas.width, i * tile);

    ctx.stroke();

  }


  /* غذا */

  const foodX =
    food.x * tile + tile / 2;

  const foodY =
    food.y * tile + tile / 2;

  ctx.shadowColor = "#ef4444";
  ctx.shadowBlur = 18;

  ctx.fillStyle = "#ef4444";

  ctx.beginPath();

  ctx.arc(
    foodX,
    foodY,
    tile * .35,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;


  /* مار */

  snake.forEach((part, index) => {

    const x = part.x * tile;
    const y = part.y * tile;

    const padding = 2;

    if (index === 0) {

      ctx.fillStyle = "#bbf7d0";

      ctx.shadowColor = "#22c55e";
      ctx.shadowBlur = 15;

    } else {

      ctx.fillStyle =
        index % 2 === 0
        ? "#22c55e"
        : "#16a34a";

      ctx.shadowBlur = 0;

    }

    roundRect(
      ctx,
      x + padding,
      y + padding,
      tile - padding * 2,
      tile - padding * 2,
      6
    );

    ctx.fill();

    ctx.shadowBlur = 0;

  });


  /* چشم‌های مار */

  if (snake.length > 0) {

    const head = snake[0];

    const hx =
      head.x * tile;

    const hy =
      head.y * tile;

    ctx.fillStyle = "#052e16";

    let eye1;
    let eye2;

    if (direction.x !== 0) {

      eye1 = {
        x: hx + tile * .68,
        y: hy + tile * .30
      };

      eye2 = {
        x: hx + tile * .68,
        y: hy + tile * .70
      };

    } else {

      eye1 = {
        x: hx + tile * .30,
        y: hy + tile * .30
      };

      eye2 = {
        x: hx + tile * .70,
        y: hy + tile * .30
      };

    }

    ctx.beginPath();

    ctx.arc(
      eye1.x,
      eye1.y,
      2.5,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      eye2.x,
      eye2.y,
      2.5,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

}


/* =========================
   مستطیل گرد
========================= */

function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
) {

  ctx.beginPath();

  ctx.moveTo(x + radius, y);

  ctx.lineTo(
    x + width - radius,
    y
  );

  ctx.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + radius
  );

  ctx.lineTo(
    x + width,
    y + height - radius
  );

  ctx.quadraticCurveTo(
    x + width,
    y + height,
    x + width - radius,
    y + height
  );

  ctx.lineTo(
    x + radius,
    y + height
  );

  ctx.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - radius
  );

  ctx.lineTo(
    x,
    y + radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x + radius,
    y
  );

  ctx.closePath();

}


/* =========================
   شروع اولیه
========================= */

drawInitialScreen();

function drawInitialScreen() {

  snake = [
    {x: 10, y: 11},
    {x: 9, y: 11},
    {x: 8, y: 11}
  ];

  food = {
    x: 15,
    y: 11
  };

  direction = {
    x: 1,
    y: 0
  };

  draw();

}

</script>

</body>
</html>
