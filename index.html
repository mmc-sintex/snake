<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Online 🐍</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #18352b 0%, #07110d 45%, #030706 100%);
      display: flex;
      justify-content: center;
      padding: 25px 12px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      color: #64ff7a;
      text-shadow: 0 0 20px rgba(100,255,122,.3);
    }

    .subtitle {
      color: #9cb5a4;
      font-size: 14px;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 280px;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: rgba(12, 25, 19, .88);
      border: 1px solid #254735;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1;
      margin: auto;
      background: #07110c;
      border-radius: 12px;
      border: 2px solid #294b36;
      image-rendering: pixelated;
      touch-action: none;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 14px 4px 0;
      font-size: 18px;
    }

    .score {
      color: #64ff7a;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #91aa9a;
      min-height: 22px;
      margin: 8px 0;
      font-size: 13px;
    }

    .leaderboard h2 {
      margin: 0 0 14px;
      font-size: 20px;
      color: #64ff7a;
    }

    .player {
      display: grid;
      grid-template-columns: 35px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px 7px;
      border-bottom: 1px solid #1b3326;
    }

    .player:last-child {
      border-bottom: 0;
    }

    .rank {
      color: #879d8d;
      font-weight: bold;
    }

    .rank.top {
      color: #ffd65a;
    }

    .player-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-score {
      color: #64ff7a;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #657a6c;
      padding: 20px 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
    }

    .controls button,
    .start-btn {
      border: 0;
      border-radius: 12px;
      background: #173323;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      min-height: 50px;
    }

    .controls button:active,
    .start-btn:active {
      transform: scale(.95);
      background: #235032;
    }

    .up {
      grid-column: 2;
    }

    .left {
      grid-column: 1;
    }

    .down {
      grid-column: 2;
    }

    .right {
      grid-column: 3;
    }

    .start-btn {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(135deg, #35c955, #178c38);
      font-size: 16px;
      font-weight: bold;
    }

    .name-box {
      margin-bottom: 12px;
    }

    .name-box label {
      display: block;
      margin-bottom: 7px;
      color: #9cb5a4;
      font-size: 13px;
    }

    input {
      width: 100%;
      border: 1px solid #31553e;
      outline: none;
      background: #08140d;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }

    input:focus {
      border-color: #64ff7a;
    }

    .tip {
      margin-top: 15px;
      color: #718a79;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    @media (max-width: 700px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .leaderboard {
        order: 2;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🐍 Snake Online</h1>
    <div class="subtitle">امتیازت را ثبت کن و برو صدر لیدربرد!</div>
  </header>

  <div class="game-layout">

    <section class="card">

      <div class="name-box">
        <label for="playerName">نام بازیکن</label>
        <input
          id="playerName"
          maxlength="20"
          autocomplete="nickname"
          placeholder="مثلاً: Ali"
        >
      </div>

      <canvas id="game" width="400" height="400"></canvas>

      <div class="stats">
        <div>امتیاز: <span class="score" id="score">0</span></div>
        <div>رکورد: <span class="score" id="best">0</span></div>
      </div>

      <div class="status" id="status">
        برای شروع روی دکمه بزن
      </div>

      <button class="start-btn" id="startBtn">
        شروع بازی 🎮
      </button>

      <div class="controls">
        <button class="up" data-dir="up">⬆️</button>
        <button class="left" data-dir="left">⬅️</button>
        <button class="down" data-dir="down">⬇️</button>
        <button class="right" data-dir="right">➡️</button>
      </div>

      <div class="tip">
        کنترل با Arrow Keys یا WASD<br>
        موبایل: از دکمه‌های پایین استفاده کن
      </div>

    </section>

    <aside class="card leaderboard">
      <h2>🏆 لیدربرد آنلاین</h2>
      <div id="leaderboard">
        <div class="empty">در حال دریافت...</div>
      </div>
    </aside>

  </div>
</div>

<script>
/* =========================================================
   SUPABASE CONFIG
   این دو مقدار را از پروژه Supabase خودت بگیر.
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseConfigured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_") &&
  !SUPABASE_KEY.includes("YOUR_");

const supabaseClient = supabaseConfigured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;


/* =========================================================
   GAME
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const nameInput = document.getElementById("playerName");
const leaderboardEl = document.getElementById("leaderboard");

const GRID = 20;
const CELL = canvas.width / GRID;

let snake = [];
let food = {};
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };

let score = 0;
let best = Number(localStorage.getItem("snake_best") || 0);

let gameRunning = false;
let gameTimer = null;

bestEl.textContent = best;


/* =========================================================
   HELPERS
   ========================================================= */

function randomFood() {
  let position;

  do {
    position = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (
    snake.some(part => part.x === position.x && part.y === position.y)
  );

  return position;
}


function drawRoundedRect(x, y, width, height, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, radius);
  ctx.fill();
}


function draw() {
  ctx.fillStyle = "#07110c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = "rgba(70,130,85,.08)";
  ctx.lineWidth = 1;

  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // food
  const fx = food.x * CELL;
  const fy = food.y * CELL;

  ctx.fillStyle = "#ff4d67";
  ctx.shadowColor = "#ff4d67";
  ctx.shadowBlur = 15;

  ctx.beginPath();
  ctx.arc(
    fx + CELL / 2,
    fy + CELL / 2,
    CELL * .32,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.shadowBlur = 0;

  // snake
  snake.forEach((part, index) => {
    const padding = 2;

    drawRoundedRect(
      part.x * CELL + padding,
      part.y * CELL + padding,
      CELL - padding * 2,
      CELL - padding * 2,
      5,
      index === 0 ? "#8cff9b" : "#39d95b"
    );
  });

  // eyes
  if (snake.length) {
    const head = snake[0];

    ctx.fillStyle = "#07110c";

    let eye1;
    let eye2;

    if (direction.x === 1) {
      eye1 = [head.x * CELL + 14, head.y * CELL + 6];
      eye2 = [head.x * CELL + 14, head.y * CELL + 14];
    } else if (direction.x === -1) {
      eye1 = [head.x * CELL + 6, head.y * CELL + 6];
      eye2 = [head.x * CELL + 6, head.y * CELL + 14];
    } else if (direction.y === -1) {
      eye1 = [head.x * CELL + 6, head.y * CELL + 6];
      eye2 = [head.x * CELL + 14, head.y * CELL + 6];
    } else {
      eye1 = [head.x * CELL + 6, head.y * CELL + 14];
      eye2 = [head.x * CELL + 14, head.y * CELL + 14];
    }

    ctx.beginPath();
    ctx.arc(eye1[0], eye1[1], 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(eye2[0], eye2[1], 2, 0, Math.PI * 2);
    ctx.fill();
  }
}


function startGame() {
  const name = nameInput.value.trim();

  if (!name) {
    nameInput.focus();
    statusEl.textContent = "اول یک اسم وارد کن!";
    return;
  }

  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];

  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };

  score = 0;
  scoreEl.textContent = score;

  food = randomFood();

  gameRunning = true;

  statusEl.textContent = "بازی شروع شد! 🚀";
  startBtn.textContent = "شروع دوباره 🔄";

  clearInterval(gameTimer);
  gameTimer = setInterval(update, 105);

  draw();
}


function update() {
  if (!gameRunning) return;

  direction = nextDirection;

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // wall collision
  if (
    head.x < 0 ||
    head.x >= GRID ||
    head.y < 0 ||
    head.y >= GRID
  ) {
    endGame();
    return;
  }

  // self collision
  if (
    snake.some(part => part.x === head.x && part.y === head.y)
  ) {
    endGame();
    return;
  }

  snake.unshift(head);

  // food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;

    food = randomFood();

    // speed up
    const speed = Math.max(55, 105 - Math.floor(score / 50) * 5);

    clearInterval(gameTimer);
    gameTimer = setInterval(update, speed);
  } else {
    snake.pop();
  }

  draw();
}


async function endGame() {
  gameRunning = false;

  clearInterval(gameTimer);

  if (score > best) {
    best = score;
    localStorage.setItem("snake_best", best);
    bestEl.textContent = best;
  }

  statusEl.textContent = `باختی! امتیاز: ${score} 😵`;

  if (score > 0) {
    await submitScore();
  }
}


/* =========================================================
   CONTROLS
   ========================================================= */

function changeDirection(dir) {
  if (!gameRunning) return;

  const directions = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  const newDirection = directions[dir];

  // جلوگیری از برگشت 180 درجه
  if (
    newDirection.x === -direction.x &&
    newDirection.y === -direction.y
  ) {
    return;
  }

  nextDirection = newDirection;
}


document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",

    w: "up",
    W: "up",
    s: "down",
    S: "down",
    a: "left",
    A: "left",
    d: "right",
    D: "right"
  };

  if (keys[event.key]) {
    event.preventDefault();
    changeDirection(keys[event.key]);
  }
});


document.querySelectorAll(".controls button").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    changeDirection(button.dataset.dir);
  });
});


startBtn.addEventListener("click", startGame);


/* =========================================================
   SUPABASE
   ========================================================= */

async function ensureAnonymousUser() {
  if (!supabaseClient) return false;

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) return true;

  const { error } = await supabaseClient.auth.signInAnonymously();

  if (error) {
    console.error("Auth error:", error);
    return false;
  }

  return true;
}


async function submitScore() {
  if (!supabaseConfigured) {
    statusEl.textContent =
      `امتیاز ${score} ثبت شد؛ Supabase هنوز تنظیم نشده.`;
    return;
  }

  const name = nameInput.value.trim().slice(0, 20);

  if (!name || score <= 0) return;

  statusEl.textContent = "در حال ثبت امتیاز...";

  try {
    const authenticated = await ensureAnonymousUser();

    if (!authenticated) {
      throw new Error("Anonymous authentication failed");
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      throw new Error("User not found");
    }

    const { error } = await supabaseClient
      .from("leaderboard")
      .insert({
        player_name: name,
        score: score,
        user_id: user.id
      });

    if (error) throw error;

    statusEl.textContent = "امتیازت وارد لیدربرد شد! 🏆";

    await loadLeaderboard();

  } catch (error) {
    console.error(error);

    statusEl.textContent =
      "ثبت آنلاین امتیاز انجام نشد؛ تنظیمات Supabase را بررسی کن.";
  }
}


async function loadLeaderboard() {
  if (!supabaseConfigured) {
    leaderboardEl.innerHTML = `
      <div class="empty">
        Supabase را تنظیم کن تا<br>
        لیدربرد آنلاین فعال شود.
      </div>
    `;
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from("leaderboard")
      .select("player_name, score")
      .order("score", { ascending: false })
      .limit(10);

    if (error) throw error;

    if (!data || data.length === 0) {
      leaderboardEl.innerHTML =
        `<div class="empty">هنوز رکوردی ثبت نشده!</div>`;
      return;
    }

    leaderboardEl.innerHTML = data.map((player, index) => `
      <div class="player">
        <div class="rank ${index < 3 ? "top" : ""}">
          ${index + 1}
        </div>

        <div class="player-name">
          ${escapeHtml(player.player_name)}
        </div>

        <div class="player-score">
          ${player.score}
        </div>
      </div>
    `).join("");

  } catch (error) {
    console.error(error);

    leaderboardEl.innerHTML = `
      <div class="empty">
        خطا در دریافت لیدربرد
      </div>
    `;
  }
}


function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   INIT
   ========================================================= */

draw();
loadLeaderboard();

</script>

</body>
</html>
